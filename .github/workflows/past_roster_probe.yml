name: Past Roster Probe
# Run by hand. Checks whether PlayByPoint still serves a session's roster after
# it has been played, so DUPR-rated sessions can be re-read 3 and 10 days later
# for everyone's after-rating. Prints counts only: never a name, an id, a
# rating, an email or a cookie. Writes nothing.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx curl_cffi python-dotenv loguru rich typer tenacity
      - name: Probe past rosters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PBP_COOKIES_JSON: ${{ secrets.PBP_COOKIES_JSON }}
        run: python past_roster_probe.py
