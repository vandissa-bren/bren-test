name: Coach Names Probe
# Run by hand. Looks for coaches' full names in PlayByPoint's data: program
# pages, the venue's pros page, and the coach-list addresses PlayByPoint's own
# JavaScript calls, tried signed out and with the scrape's login. Prints field
# names, addresses and value SHAPES only ("Aaaa Aaaaaa"), never a name or a
# cookie, so the log is safe to share.
on:
  workflow_dispatch:
    inputs:
      facilities:
        description: 'PlayByPoint facility ids, comma separated'
        required: false
        default: '1379,885'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install curl_cffi
      - name: Look for coach names
        env:
          PROBE_FACILITIES: ${{ github.event.inputs.facilities }}
          PBP_COOKIES_JSON: ${{ secrets.PBP_COOKIES_JSON }}
        run: python coach_names_probe.py
