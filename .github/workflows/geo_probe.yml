name: Geo Probe
# Run by hand. Says whether GitHub's runners can read the three geo-restricted
# venues (SportsWell, Raya, Pickle4Real), whose court hire currently needs a
# Sydney server. Prints counts and status only, never a cookie. Saves nothing.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx curl_cffi loguru python-dotenv rich supabase typer tenacity
      - name: Probe the geo-restricted venues
        env:
          PBP_COOKIES_JSON: ${{ secrets.PBP_COOKIES_JSON }}
        run: python geo_probe.py
